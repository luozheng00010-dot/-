# 语义剪辑引擎配置：仅保留本地语义剪辑所需的配音（TTS）、代理与存储设置。
# 远程素材源、文案自动生成、任务流水线等旧版配置已随功能一并移除。
log_level = "INFO"
listen_host = "0.0.0.0"
listen_port = 8080

[app]
api_key = ""
tls_verify = true
edge_tts_timeout = 30
mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "请用自然、清晰、适合短视频旁白的语气朗读。"

[proxy]

[azure]
speech_key = ""
speech_region = ""

[minimax_tts]
api_key = ""
base_url = ""
model_id = "speech-2.8-hd"
voice_id = "English_expressive_narrator"
sample_rate = 32000
bitrate = 128000
audio_format = "mp3"
channel = 1
pitch = 0

[elevenlabs]
api_key = ""
model_id = "eleven_multilingual_v2"

[chatterbox]
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"
voices = [ "default-Female",]

[kokoro]
base_url = "http://127.0.0.1:8880/v1"
api_key = ""
model_id = "kokoro"
voices = []

[fish_audio]
api_key = ""
model = "s2.1-pro-free"
voices = []

[voxcpm]
base_url = "https://api.modelbest.cn/v1"
api_key = ""
model_id = ""
voice_id = "default"

# 本地素材存储位置。留空表示使用默认的 storage/local_videos；
# 也可在管理页面修改（管理页面保存后会写入这里）。
